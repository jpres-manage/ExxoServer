image: node:16

pipelines:
  default:
    - step:
        name: Deploy to AWS EC2
        script:
          - export CI_IP=$(curl http://whatismyip.akamai.com/)
          - echo "Outgoing CI IP is $CI_IP"
          - echo $SSH_KEY | base64 --decode > ./deployment_key.pem
          - chmod 600 ./deployment_key.pem
          - ssh-keygen -y -f ./deployment_key.pem
          - ls -l ./deployment_key.pem
          - ssh -o StrictHostKeyChecking=no -i ./deployment_key.pem ubuntu@ec2-13-238-120-209.ap-southeast-2.compute.amazonaws.com "bash /var/www/exxocap/scripts/scripts.sh"
         
          # - ssh -o StrictHostKeyChecking=no -i ./deployment_key.pem ubuntu@ec2-13-238-120-209.ap-southeast-2.compute.amazonaws.com "sudo chmod +x /var/www/exxohub/backend/deploy-scripts/deploy.sh && bash /var/www/exxohub/backend/deploy_scripts/deploy.sh "
          # - ssh -o StrictHostKeyChecking=no -i ./deployment_key.pem ubuntu@ec2-13-238-120-209.ap-southeast-2.compute.amazonaws.com "source ~/.nvm/nvm.sh  && pm2 start /var/www/exxohub/backend/index.js --name 'exxo-server' --time --update-env -i max --listen-timeout 8000 --port 8080"
